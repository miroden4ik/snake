<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- Top bar -->
    <header class="top-bar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" width="32" height="32">
          <rect x="4" y="4" width="24" height="24" rx="6" fill="#6BCB77"/>
          <circle cx="12" cy="14" r="2" fill="#fff"/>
          <circle cx="20" cy="14" r="2" fill="#fff"/>
          <path d="M12 20 Q16 24 20 20" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Snake</span>
      </div>
      <div class="hud-group">
        <div id="user-chip" class="user-chip hidden">
          <img id="user-avatar" class="user-avatar" alt="">
          <span id="user-name" class="user-name">Игрок</span>
        </div>
        <div id="timer-chip" class="timer-chip hidden">
          <svg class="timer-icon" viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M12 9v4l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M10 2h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
          <span id="timer">1:00</span>
        </div>
        <div class="score-display">
          <svg class="coin-icon" viewBox="0 0 24 24" width="20" height="20">
            <circle cx="12" cy="12" r="10" fill="#FFD93D" stroke="#E8A317" stroke-width="2"/>
            <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#E8A317">$</text>
          </svg>
          <span id="score">0</span>
        </div>
      </div>
    </header>

    <!-- Start screen -->
    <div id="screen-start" class="screen active">
      <div class="start-content">
        <svg class="start-snake" viewBox="0 0 200 200" width="200" height="200">
          <rect x="40" y="100" width="40" height="40" rx="10" fill="#6BCB77"/>
          <rect x="80" y="100" width="40" height="40" rx="10" fill="#5BB868"/>
          <rect x="120" y="100" width="40" height="40" rx="10" fill="#6BCB77"/>
          <rect x="120" y="60" width="40" height="40" rx="10" fill="#4AA858"/>
          <circle cx="132" cy="72" r="4" fill="#fff"/>
          <circle cx="148" cy="72" r="4" fill="#fff"/>
          <circle cx="132" cy="72" r="2" fill="#222"/>
          <circle cx="148" cy="72" r="2" fill="#222"/>
          <path d="M160 82 L172 78 M160 82 L172 86" stroke="#E84545" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="60" cy="56" r="16" fill="#E84545"/>
          <ellipse cx="60" cy="44" rx="4" ry="6" fill="#6BCB77" transform="rotate(-20 60 44)"/>
        </svg>
        <h1 class="title">Snake</h1>
        <p id="subtitle" class="subtitle">Собирай яблоки и расти!</p>
        <div class="mode-toggle" role="tablist">
          <button class="mode-btn active" data-mode="endless">Бесконечная</button>
          <button class="mode-btn" data-mode="race">Гонка</button>
        </div>
        <div id="dur-row" class="duration-row hidden">
          <button class="dur-chip active" data-sec="60">60 с</button>
          <button class="dur-chip" data-sec="90">90 с</button>
          <button class="dur-chip" data-sec="120">120 с</button>
        </div>
        <p id="mode-best" class="mode-best">Рекорд: 0</p>
        <button id="btn-play" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right:8px">
            <polygon points="6,4 20,12 6,20" fill="#fff"/>
          </svg>
          Играть
        </button>
        <button id="btn-leaders" class="btn btn-leaders hidden">
          <svg viewBox="0 0 24 24" width="18" height="18" style="margin-right:8px">
            <path d="M7 4h10v5a5 5 0 0 1-10 0V4z" fill="currentColor"/>
            <path d="M7 5H4v1a4 4 0 0 0 3.4 3.96M17 5h3v1a4 4 0 0 1-3.4 3.96" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 14v4m-3 0h6" stroke="currentColor" stroke-width="1.8" fill="none"/>
          </svg>
          Таблица лидеров
        </button>
      </div>
    </div>

    <!-- Game screen -->
    <div id="screen-game" class="screen">
      <div class="game-wrapper">
        <div class="canvas-wrap">
          <canvas id="game-canvas"></canvas>
        </div>
        <!-- Mobile D-pad -->
        <div class="dpad">
          <button class="dpad-btn dpad-up" data-dir="up">
            <svg viewBox="0 0 24 24" width="28" height="28"><polygon points="12,4 20,16 4,16" fill="currentColor"/></svg>
          </button>
          <button class="dpad-btn dpad-left" data-dir="left">
            <svg viewBox="0 0 24 24" width="28" height="28"><polygon points="4,12 16,4 16,20" fill="currentColor"/></svg>
          </button>
          <button class="dpad-btn dpad-right" data-dir="right">
            <svg viewBox="0 0 24 24" width="28" height="28"><polygon points="20,12 8,4 8,20" fill="currentColor"/></svg>
          </button>
          <button class="dpad-btn dpad-down" data-dir="down">
            <svg viewBox="0 0 24 24" width="28" height="28"><polygon points="12,20 4,8 20,8" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Game Over screen -->
    <div id="screen-over" class="screen">
      <div class="over-content">
        <svg class="over-icon" viewBox="0 0 120 120" width="120" height="120">
          <circle cx="60" cy="60" r="54" fill="#FFE0E0" stroke="#E84545" stroke-width="4"/>
          <circle cx="42" cy="50" r="6" fill="#E84545"/>
          <circle cx="78" cy="50" r="6" fill="#E84545"/>
          <path d="M40 80 Q60 64 80 80" stroke="#E84545" stroke-width="4" fill="none" stroke-linecap="round"/>
          <line x1="30" y1="36" x2="50" y2="44" stroke="#E84545" stroke-width="3" stroke-linecap="round"/>
          <line x1="90" y1="36" x2="70" y2="44" stroke="#E84545" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <h2 class="over-title" id="over-title">Игра окончена</h2>
        <div class="over-stats">
          <div class="stat">
            <span class="stat-value" id="final-score">0</span>
            <span class="stat-label">Очки</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="best-score">0</span>
            <span class="stat-label">Рекорд</span>
          </div>
        </div>
        <p id="lb-status" class="lb-status"></p>
        <button id="btn-leaders-over" class="btn btn-secondary btn-small hidden">
          <svg viewBox="0 0 24 24" width="18" height="18" style="margin-right:8px">
            <path d="M7 4h10v5a5 5 0 0 1-10 0V4z" fill="currentColor"/>
            <path d="M7 5H4v1a4 4 0 0 0 3.4 3.96M17 5h3v1a4 4 0 0 1-3.4 3.96" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 14v4m-3 0h6" stroke="currentColor" stroke-width="1.8" fill="none"/>
          </svg>
          Таблица лидеров
        </button>
        <button id="btn-retry" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right:8px">
            <path d="M12 4V1L8 5l4 4V6a6 6 0 0 1 0 12 6 6 0 0 1-6-6H4a8 8 0 0 0 8 8z" fill="#fff"/>
          </svg>
          Заново
        </button>
        <button id="btn-home" class="btn btn-secondary">В меню</button>
      </div>
    </div>

    <!-- Leaderboard modal -->
    <div id="lb-modal" class="lb-modal">
      <div id="lb-modal-bg" class="lb-modal-bg"></div>
      <div class="lb-panel">
        <div class="lb-head">
          <h3>Лидеры · Гонка</h3>
          <button id="btn-lb-close" class="lb-close" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="lb-tabs">
          <button class="lb-tab" data-cat="race60">60 с</button>
          <button class="lb-tab" data-cat="race90">90 с</button>
          <button class="lb-tab" data-cat="race120">120 с</button>
        </div>
        <div id="lb-list" class="lb-list"></div>
        <p class="lb-hint">Яблок за отведённое время. Топ-10 по каждой длительности.</p>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="script.js"></script>
</body>
</html>
